services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: travel-ai-backend

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: travel-ai-frontend

    environment:
      TRAVEL_API_URL: http://backend:8000

    ports:
      - "8501:8501"

    depends_on:
      - backend


volumes:
  hf_cache: